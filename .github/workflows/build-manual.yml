name: Build Windows (manual)

# 手动触发：仓库页面 → Actions → 左侧选 "Build Windows (manual)" → Run workflow。
# 只编 Windows 版，跑完在本次运行页面的 Artifacts 里下载，不创建 Release、不占 tag。
# 放到仓库的 .github/workflows/build-manual.yml 即可。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP 'Glance-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item 'src-tauri/target/release/glance.exe' (Join-Path $portableDir 'Glance.exe')
          @'
          Glance Windows 便携版（含复制按钮改动）

          无需安装，解压后直接运行 Glance.exe。
          Windows 10/11 通常已内置 Microsoft Edge WebView2 Runtime；若启动失败，
          请安装 Evergreen WebView2 Runtime 后重试：
          https://developer.microsoft.com/microsoft-edge/webview2/
          '@ | Set-Content -Encoding utf8 (Join-Path $portableDir 'README.txt')
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath 'Glance-windows-x64-portable.zip' -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Glance-windows-x64-portable
          path: |
            Glance-windows-x64-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
